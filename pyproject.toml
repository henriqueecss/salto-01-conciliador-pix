[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliador-pix"
version = "0.1.0"
description = "Conciliador de pagamentos Pix para a Doce Ipê Confeitaria"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "scipy>=1.11",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "httpx>=0.24",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
